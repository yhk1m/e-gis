<!-- © 2026 김용현 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: 외부 리소스를 필요한 출처로만 제한(추적 비콘·내부망 프로빙 차단). script/style은 Vite·OL 호환 위해 unsafe-inline
         (실질 XSS 방어는 DOMPurify). 허용: 이미지=모든 https(임의 웹 이미지 URL 지원)+data:/blob:, Supabase(REST+realtime), YouTube 임베드. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://e-gis.kr; connect-src 'self' ws://localhost:* http://localhost:* https://lufbotdmhgsuvejlytgh.supabase.co wss://lufbotdmhgsuvejlytgh.supabase.co; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-GIS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 저장된 테마를 첫 페인트 전에 적용(다크→라이트 깜빡임 방지). 기본은 다크. -->
    <script>
      try { if (localStorage.getItem('egis-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
    <style id="pdf-page-rule"></style><!-- PDF 저장 직전 @page 크기 주입(보고서 A4 / 발표 16:9) -->
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/dangto.css" /><!-- 당토 디자인 덮어쓰기 (이 줄을 빼면 예전 모습) -->
    <link rel="stylesheet" href="./src/controls.css" /><!-- 당토 공통 부품: 버튼, 체크, 세그먼트 -->
  </head>
  <body>
    <div id="app-tabs">
      <div class="app-seg" role="group" aria-label="화면 고르기">
      <button id="tab-egis" class="app-tab" type="button">e-GIS</button>
      <button id="tab-estory" class="app-tab active" type="button">e-GIStory</button>
      <button id="tab-split" class="app-tab" type="button" title="e-GIStory와 e-GIS를 나란히 놓고 작업, 발표"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg><span>분할</span></button>
      </div>
      <button id="tab-swap" class="app-tab" type="button" title="e-GIS 좌우 위치 바꾸기" aria-label="좌우 바꾸기"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-3-3"/><path d="M17 17H4l3 3"/></svg></button>
    </div>
    <div id="app" inert>
      <header id="toolbar">
        <strong class="brand"><span class="brand-e">e</span>-GIStory</strong>
        <button id="btn-projects" type="button" title="저장하고 프로젝트 목록으로 가요 (다른 프로젝트 열기, 로그아웃)"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>프로젝트</span></button>
        <button id="btn-import" type="button"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="M9 14l3 3 3-3"/></svg><span>.egis 열기</span></button>
        <button id="btn-folder" type="button"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1"/><path d="M3 7v10a2 2 0 0 0 2 2h12l3-8H7l-3 8"/></svg><span>저장 폴더</span></button>
        <button id="btn-present" type="button" title="발표 화면으로 보기 (Esc로 끝내기)"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg><span>발표</span></button>
        <button id="btn-slidepdf" type="button" title="발표 슬라이드를 PDF로 저장 (16:9)"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg><span>발표 PDF</span></button>
        <button id="btn-publish" type="button" title="이 스토리맵을 웹에 게시해요. 링크가 있으면 누구나 볼 수 있어요"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg><span>게시</span></button>
        <label id="layout-select-label" title="발표 텍스트 레이아웃 (프로젝트 전체)">레이아웃
          <select id="layout-select">
            <option value="band">밴드</option>
            <option value="panel">패널</option>
            <option value="card">카드</option>
          </select>
        </label>
        <label id="pos-select-label" title="레이아웃 위치 (프로젝트 전체)">위치
          <select id="pos-select">
            <option value="left">왼쪽</option>
            <option value="right">오른쪽</option>
            <option value="top">위</option>
            <option value="bottom">아래</option>
          </select>
        </label>
        <label id="font-select-label" title="슬라이드 글꼴 (프로젝트 전체)">글꼴
          <select id="font-select">
            <option value="default">맑은 고딕</option>
            <option value="sans">Noto Sans</option>
            <option value="serif">Noto Serif</option>
            <option value="system">시스템 글꼴…</option>
          </select>
        </label>
        <input id="font-custom" list="font-suggestions" placeholder="글꼴 이름" title="컴퓨터에 설치된 글꼴 이름 입력" hidden />
        <datalist id="font-suggestions">
          <option value="굴림"></option>
          <option value="돋움"></option>
          <option value="바탕"></option>
          <option value="궁서"></option>
          <option value="나눔고딕"></option>
          <option value="나눔명조"></option>
          <option value="나눔스퀘어"></option>
          <option value="본고딕"></option>
          <option value="함초롬바탕"></option>
          <option value="Arial"></option>
          <option value="Times New Roman"></option>
          <option value="Georgia"></option>
          <option value="Consolas"></option>
        </datalist>
        <label id="legend-toggle-label" title="지도 위 범례 표시"><input type="checkbox" id="legend-toggle" checked /> 범례</label>
        <label id="cloud-toggle-label" title="로그인하면 이 스토리맵을 클라우드에도 자동 저장해요"><input type="checkbox" id="cloud-toggle" disabled /> 클라우드 동기화</label>
        <span id="save-status"></span>
        <span id="status"></span>
        <button id="btn-theme" type="button" title="테마 바꾸기" aria-label="테마 바꾸기"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </header>
      <div id="workspace">
        <aside id="sidebar">
          <section class="panel">
            <h2 class="panel-title">소스</h2>
            <div id="source-panel"></div>
          </section>
          <section class="panel">
            <h2 class="panel-title">페이지</h2>
            <div id="page-list"></div>
          </section>
        </aside>
        <div id="map-stage">
          <div id="slide-canvas">
            <div id="map"><div id="legend" hidden></div></div>
            <div id="slide-preview"></div>
          </div>
          <div id="map-tools">
            <button id="btn-capture" type="button" title="지금 지도 화면을 이 슬라이드의 위치로 저장"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span>이 위치 저장</span></button>
            <button id="btn-cam-all" type="button" title="지금 지도 위치를 모든 슬라이드에 적용"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>모든 슬라이드에 적용</span></button>
            <button id="btn-cam-sync" type="button" title="다른 슬라이드의 위치를 이 슬라이드로 가져오기"><svg class="dt-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>위치 가져오기</span></button>
            <div id="cam-sync-pop" hidden></div>
          </div>
        </div>
        <aside id="content-sidebar">
          <section class="panel">
            <h2 class="panel-title">콘텐츠</h2>
            <div id="content-panel"></div>
          </section>
        </aside>
      </div>
    </div>
    <div id="start-screen"></div>
    <div id="presentation"></div>
    <div id="report" hidden></div>
    <div id="egis-pane"><webview id="egis-webview" allowpopups></webview></div>
    <div id="split-divider" title="드래그로 분할 비율 조절"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
