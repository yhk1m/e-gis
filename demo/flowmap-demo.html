<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-GIS 흐름도 시연 — 시도 간 인구이동</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.0.0/ol.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- 페이지 스타일은 src/demo/flowmap-demo.css (flowmap-demo.js 가 import) -->
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>흐름도 시연</h1>
    <span class="badge">예시 자료 · 가상 수치</span>
    <div class="row"><label>애니메이션</label><input type="checkbox" id="animate" checked></div>
    <div class="row"><label>색상</label><select id="ramp"><option value="teal">청록</option><option value="blue">파랑</option><option value="orange">주황</option><option value="purple">보라</option></select></div>
    <div class="row"><label>굵기</label><input type="range" id="width" min="0.3" max="2.5" step="0.1" value="1"></div>
    <div class="row"><label>상위 N개 (0=전부)</label><input type="number" id="topn" min="0" value="0" style="width:60px"></div>
    <div class="row"><label>위치 원</label><input type="checkbox" id="locs" checked></div>
    <div class="row"><label>곡선으로 그리기</label><input type="checkbox" id="curved"></div>
    <div class="hint">지역 원을 클릭하면 그 지역과 이어진 흐름만 남습니다 (여러 개 선택 가능, 빈 곳 클릭으로 해제).<br>선 위에 마우스를 올리면 출발 → 도착과 양이 보입니다.</div>
  </div>
  <div class="legend">
    <div><span class="dot" style="background:#22c55e"></span>순유입 지역</div>
    <div><span class="dot" style="background:#ef4444"></span>순유출 지역</div>
    <div style="margin-top:4px;color:#94a3b8">선 굵기·색 = 이동량 (출발 가늘게 → 도착 굵게)</div>
  </div>
  <script type="module" src="/src/demo/flowmap-demo.js"></script>
</body>
</html>
